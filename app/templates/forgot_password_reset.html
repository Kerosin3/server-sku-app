{% extends "base.html" %}
{% block title %}Восстановление пароля — Server SKU Tracker{% endblock %}
{% block content %}
<h1>Восстановление пароля</h1>
{% if error %}<p style="color:red">{{ error }}</p>{% endif %}
<form method="post" action="/forgot-password/reset">
  <input type="hidden" name="username" value="{{ username }}">
  <label>{{ question }} <input type="text" name="answer" required></label><br>
  <label>Новый пароль <input type="password" name="new_password" required minlength="8"></label><br>
  <label>Повторите новый пароль <input type="password" name="new_password_confirm" required minlength="8"></label><br>
  <button type="submit">Сбросить пароль</button>
</form>
<p><a href="/login">← К входу</a></p>
{% endblock %}
