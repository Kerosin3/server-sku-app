<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Server SKU Tracker{% endblock %}</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.3/htmx.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header>
    <a href="/"><strong>Server SKU Tracker</strong></a>
    {% if user %}
      <a href="/">Изделия</a>
      <a href="/platforms">Платформы и исполнения</a>
      <a href="/part-units/unowned">Детали без владельца</a>
      {% if user.role == 'admin' %}
        <a href="/users">Пользователи</a>
      {% endif %}
      <a href="/account/security-question">{{ user.username }} ({{ user.role | label('role') }})</a>
      <form method="post" action="/logout" style="display:inline">
        <button type="submit">Выйти</button>
      </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
