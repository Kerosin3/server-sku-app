{% extends "base.html" %}
{% block content %}
<h1>Изделия</h1>

<input type="search" placeholder="Поиск по серийнику / asset tag"
       hx-get="/search" hx-trigger="keyup changed delay:300ms" hx-target="#search-results">
<div id="search-results"></div>

<table>
  <thead>
    <tr><th>Asset tag</th><th>Исполнение</th><th>Статус</th><th>Обновлено</th></tr>
  </thead>
  <tbody>
    {% for i in items %}
    <tr>
      <td><a href="/items/{{ i.id }}">{{ i.asset_tag }}</a></td>
      <td>{{ i.platform_variant.name }}</td>
      <td>{{ i.status | label('platform_status') }}</td>
      <td>{{ i.updated_at.strftime('%Y-%m-%d') }}</td>
    </tr>
    {% else %}
    <tr><td colspan="4">Изделий пока нет</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
