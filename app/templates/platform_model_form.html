{% extends "base.html" %}
{% block title %}Новая модель платформы — Server Tracker{% endblock %}
{% block content %}
<h1>Новая модель платформы</h1>
{% if error %}<p style="color:red">{{ error }}</p>{% endif %}
<form method="post" action="/platform-models">
  <label>Название <input type="text" name="name" required placeholder="напр. 2U Storage Rev C"></label><br>
  <label>Описание <input type="text" name="description"></label><br>
  <button type="submit">Создать</button>
</form>
<p><a href="/platform-models">← К списку моделей</a></p>
{% endblock %}
