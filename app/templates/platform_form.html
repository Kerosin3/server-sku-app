{% extends "base.html" %}
{% block title %}Новая платформа — Server Tracker{% endblock %}
{% block content %}
<h1>Новая платформа</h1>
{% if error %}<p style="color:red">{{ error }}</p>{% endif %}
<form method="post" action="/platforms">
  <label>Asset tag <input type="text" name="asset_tag" required></label><br>
  <label>Модель
    <select name="platform_model_id" required>
      {% for m in models %}
      <option value="{{ m.id }}">{{ m.name }}</option>
      {% endfor %}
    </select>
  </label><br>
  <label>Заказчик <input type="text" name="customer"></label><br>
  <label>Расположение <input type="text" name="location"></label><br>
  <label>Заметки <input type="text" name="notes"></label><br>
  <button type="submit">Создать</button>
</form>
<p><a href="/">← К списку платформ</a></p>
{% endblock %}
