{% extends "base.html" %}
{% block title %}Новая платформа — Server SKU Tracker{% endblock %}
{% block content %}
<h1>Новая платформа</h1>
{% if error %}<p style="color:red">{{ error }}</p>{% endif %}
<form method="post" action="/platforms">
  <label>Название <input type="text" name="name" required placeholder="напр. 2U Storage"></label><br>
  <label>Описание <input type="text" name="description"></label><br>
  <button type="submit">Создать</button>
</form>
<p><a href="/platforms">← К списку платформ</a></p>
{% endblock %}
